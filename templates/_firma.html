<!--
  La firma di serie delle mail che il registro spedisce: le comunicazioni alla
  classe, le richieste di firma alle aziende, i documenti mandati a una persona
  in formazione.

  Si riempie con l'intestazione del documento: {{docente}} e {{sede}} sono il
  nome scritto in Impostazioni › Utente › Chi sei e la scuola della prima carta
  intestata, in Utente › Carta e stampa. Senza nessuno dei due la mail parte
  senza firma.

  Chi ne vuole una sua — un telefono, l'indirizzo della sede, l'avvertenza in
  verde — la scrive in Utente › Posta, «Firma delle e-mail»: sta nel documento,
  e da lì vale questa invece di quella di serie.

  Stili in linea e niente altro: un foglio di stile esterno in una mail non
  arriva, e ogni programma di posta butta via quel che sta dentro <head>.
-->
<div style="font-family: Aptos, Calibri, sans-serif; font-size: 11pt; color: #000000;">
  <div>{{docente}}</div>
  <div style="font-size: 10pt;">{{sede}}</div>
</div>
