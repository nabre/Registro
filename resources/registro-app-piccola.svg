<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- L'icona del programma per le misure piccole, dalla 16 alla 48: la
       spirale di `registro-app.svg` con i mesi raccolti in tre spicchi,
       perché dieci stacchi a sedici pixel diventano un grigio. Le proporzioni
       restano: sei decimi di bianco, il passato; un decimo di arancio, oggi;
       tre decimi velati, quel che viene. La fascia cresce da 9,2 a 12 di
       raggio in un giro, sopra un bordo interno di 4,5, con 12 gradi di vuoto
       fra uno spicchio e l'altro. Il quadrato sta sulle unità pari del
       reticolo da 32 — i pixel interi della 16, con uno di margine — e il
       punto nel mezzo è largo due pixel esatti. -->
