    <path d="M16.43 7.78L16.97 7.79L17.51 7.84L18.05 7.92L18.59 8.04L19.11 8.19L19.63 8.38L20.14 8.6L20.64 8.86L18.34 12.39A4.3 4.3 0 0 0 16.23 11.71Z"/>
