<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <!-- L'icona del programma, per le misure grandi (64 pixel e oltre): la
       spirale dell'anno.

       Una fascia che gira attorno a un punto e a ogni grado si allarga un
       poco, tagliata in dieci spicchi: i dieci mesi di scuola, da settembre a
       mezzogiorno fino a giugno. I primi sei, già passati, sono pieni di
       bianco (`--su-tinta`); il settimo — oggi — è arancio, `--attenzione`
       del tema scuro, che sul verde si stacca; gli ultimi tre, quelli che
       vengono, sono appena velati. Nel mezzo il punto: chi tiene il registro,
       attorno a cui l'anno gira e cresce. Tempo, ritmo e crescita senza un
       oggetto da riconoscere: niente libri, niente matite.

       La geometria, per chi la ritocca: centro (16, 16), bordo interno a
       raggio 4,3, bordo esterno che va da 8,2 a mezzogiorno a 11,6 dopo un
       giro; spicchi di 30 gradi con 6 di vuoto. Il fondo è il quadrato tondo
       dell'accento, `--accento` sfumato verso `--accento-caldo`, con una luce
       appena accennata in cima.

       Le misure piccole le fa `registro-app-piccola.svg` — gli stessi mesi
       raccolti in tre spicchi —, il segno in un colore solo sta in
       `registro-segno.svg`, quello a tratto in `registro.svg`. Le immagini
       le fa `npm run icons` (`tools/icons.cjs`). -->
  <defs>
    <linearGradient id="fondo" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="30">
      <stop offset="0" stop-color="#468515"/>
      <stop offset="0.55" stop-color="#3d7a0c"/>
      <stop offset="1" stop-color="#2f6108"/>
    </linearGradient>
    <radialGradient id="luce" gradientUnits="userSpaceOnUse" cx="16" cy="3" r="20">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="url(#fondo)"/>
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="url(#luce)"/>
