  <g fill="#ffffff" fill-opacity="0.28">
    <path d="M5.75 18.75L5.56 18.08L5.41 17.39L5.31 16.7L5.25 16L5.24 15.29L5.27 14.59L5.35 13.88L5.48 13.18L11.85 14.89A4.3 4.3 0 0 0 11.85 17.11Z"/>
