<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!--
  La pagina di benvenuto: quel che si vede quando non c'è nessun anno aperto.

  Prima qui c'era `dialog.showMessageBox` — tre pulsanti di sistema, «Apri…»,
  «Crea un nuovo anno…», «Esci» — e bastava finché gli anni erano uno. Con due
  o tre documenti quel dialogo diceva la cosa sbagliata: chiedeva *come*
  cominciare quando la domanda vera era *quale* anno riaprire, e la risposta
  stava dietro un dialogo di file da sfogliare ogni volta. Qui l'elenco è la
  pagina: i preferiti in cima, i recenti sotto, e si riapre un anno con un clic
  invece che con sei.

  Il telaio sta qui; l'elenco lo riempie `welcome.ts`, l'aspetto è in
  `welcome.css`.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src registro:; script-src registro:; img-src registro:;">
<title>Regiclass</title> <!-- testo-fisso: il marchio non si traduce -->
<link rel="stylesheet" href="registro://app/dist/welcome.css">
</head>
<body>
<!-- La fascia verde della procedura d'installazione, in vettore: la stessa
     copertina di registro con cui il programma si è presentato la prima volta. -->
<img class="fascia" src="registro://app/resources/registro-fascia.svg" alt="" aria-hidden="true">

<main class="corpo">
<!-- Il filetto: c'è solo quando è uscita una versione nuova — trovata, in
     arrivo o pronta — e se ne va con la ✕ fino alla notizia successiva. Le
     parole e il gesto li scrive `environment/updates.ts`, gli stessi del
     filetto nella barra del titolo del registro. -->
<div class="filetto" id="filetto" role="status" hidden>
  <!-- `ricarica` di `src/ui/components/icons.ts`: la pagina non può importarlo,
       e il segno degli aggiornamenti deve essere lo stesso. -->
  <svg class="icona" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-.7 4.3"/><path d="M20 5v6h-6"/></svg>
  <span class="filetto__testo" id="filetto-testo"></span>
  <button type="button" class="minuto" id="filetto-gesto"></button>
  <button type="button" class="minuto filetto__chiudi" id="filetto-chiudi"
          data-testo-title="nascondiNotizia" data-testo-aria-label="nascondiNotizia">✕</button>
  <span class="filetto__quota" id="filetto-quota" hidden><span></span></span>
</div>

<header class="testata">
  <h1>Regiclass</h1> <!-- testo-fisso: il marchio non si traduce -->
  <p class="invito" id="invito"></p>
</header>

<!-- Le parole le scrive `welcome.ts` dal catalogo: `data-testo` dice quale. -->
<div class="scelte">
  <button type="button" id="apri" data-ruolo="conferma">
    <span class="titolo" data-testo="apriAnno"></span>
    <span class="sotto" data-testo="apriAnnoSotto"></span>
  </button>
  <button type="button" id="crea">
    <span class="titolo" data-testo="creaAnno"></span>
    <span class="sotto" data-testo="creaAnnoSotto"></span>
  </button>
</div>

<section class="recenti">
  <h2 data-testo="recenti"></h2>
  <ul class="voci" id="elenco"></ul>
</section>

<footer class="piede">
  <!-- La versione e, accanto, a che punto sono gli aggiornamenti: il controllo
       rapido, con il gesto che ha senso adesso. -->
  <div class="aggiornamento">
    <span class="quieto versione" id="versione"></span>
    <span class="pastiglia" id="aggiornamento-stato" hidden></span>
    <button type="button" class="minuto" id="aggiornamento-gesto" hidden></button>
  </div>
  <button type="button" id="esci" data-testo="esci"></button>
</footer>
</main>

<script src="registro://app/dist/welcome.js"></script>
</body>
</html>
