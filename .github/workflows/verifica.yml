# Le verifiche che CANTIERE.md pretende prima di spuntare una casella, fatte da
# una macchina invece che a memoria.
#
# La regola sta scritta in `docs/CANTIERE.md`: una casella si spunta quando il
# lavoro è **fatto e verificato** — `tsc` pulito, `eslint` senza errori, `npm
# test` verde. E D2 pretende che i test restino verdi a ogni passo di uno
# spostamento di cartelle da centomila righe. Finché nessuno lo controllava,
# quella pretesa valeva quanto la memoria di chi committava.
#
# Ci sono anche i controlli statici fatti in casa: non sono un extra,
# sono il modo in cui questo progetto verifica le proprie regole
# d'architettura. `strati` in particolare è scritto apposta *prima* degli
# spostamenti che deve sorvegliare — e non gira né in `pretest` né in `test`,
# quindi senza questo file non girava mai da solo.

name: verifica

on:
  # Non parte da sé: la chiama `rilascio.yml` come primo passo di ogni giro —
  # push su `main` o pull request. Averla anche qui su `push` la faceva girare
  # due volte sullo stesso commit, e una versione nuova esce comunque solo se
  # questa, sullo stesso commit, è verde.
  workflow_call:
  # Per rilanciarla a mano, da sola, su un ramo qualunque.
  workflow_dispatch:

jobs:
  verifica:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` e non `npm install`: si costruisce con le versioni bloccate,
      # che è il punto del file di blocco. Un modulo nativo montato per
      # percorso — `node-llama-cpp` — con una versione diversa da quella
      # dichiarata è una divergenza che si scopre sulla macchina di chi installa.
      - run: npm ci

      - name: Tipi
        run: npx tsc --noEmit

      - name: Stile
        run: npx eslint .

      # `pretest` costruisce i bundle di `dist-tests/`, da cui le prove
      # leggono: `npm test` da solo, su una copia appena scaricata, non
      # troverebbe niente da provare.
      - name: Prove
        run: npm test

      - name: Strati
        run: npm run layers

      - name: Censimento
        run: npm run census

      - name: Collezioni
        run: npm run collections

      - name: Moduli
        run: npm run forms

      - name: Pulsanti
        run: npm run buttons

      - name: Procedure
        run: npm run procedures

      # Il multilingua (ADR-38): nessun testo per chi usa il registro scritto
      # fuori da un catalogo, nessuna grammatica italiana fuori dai cataloghi
      # italiani, nessun catalogo letto prima che il processo scelga la lingua.
      - name: Lingue
        run: npm run i18n -- --severo

      # Che docs e skill citino script e file che esistono: una rimozione o un
      # cambio di nome lascia indietro i rimandi, e nessun compilatore li legge.
      - name: Documenti
        run: npm run docs

  # Le prove dell'interfaccia stanno in un lavoro a parte perché vogliono tre
  # cose che le altre non chiedono: Python, il pacchetto playwright e un
  # Chromium scaricato. Tenerle qui invece che nel lavoro principale vuol dire
  # che chi guarda la verifica vede subito *quale* dei due fronti è caduto, e
  # che un guasto del browser non nasconde un guasto dei tipi.
  #
  # Perché esistono: sono novecento righe di regressioni vere — navigazione,
  # comandi, filtri, tastiera, responsive, registro vuoto, e pdfjs che disegna
  # dentro il pannello — e fino a questo commit non le lanciava nessuno. Il
  # giorno in cui hanno smesso di passare non lo ha saputo nessuno per mesi.
  interfaccia:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Niente `cache: 'pip'` di setup-python: vuole un requirements.txt, e
      # playwright si installa senza. Si tiene la cartella di pip e quella dei
      # browser; la chiave cambia con la lista delle prove, e `playwright
      # install` scarica comunque la versione giusta se quella ripresa è vecchia.
      - name: Cache di pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('tools/uiTests.mjs') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache di Chromium
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/uiTests.mjs') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npm ci

      - name: Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium --with-deps

      # `tools/uiTests.mjs` costruisce da sé, con `node esbuild.mjs --ui`, i
      # bundle che le prove leggono: non serve `npm run build` prima.
      - name: Prove dell'interfaccia
        run: npm run ui-tests

  # La prova del fumo: l'unica che accende un Electron vero invece del finto
  # di `tests/helpers/fake-electron.mjs`. Costruisce, avvia il registro sul
  # campione in una cartella provvisoria, gli parla dal condotto come `regi` e
  # lo chiude con `programma.esci`. Su Windows perché lì gira il resto e perché
  # la named pipe è il caso di chi usa il registro; fuori servirebbe `xvfb-run`.
  fumo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Costruzione
        run: npm run build

      - name: Prova del fumo
        run: node tools/fumo.mjs --senza-costruire
